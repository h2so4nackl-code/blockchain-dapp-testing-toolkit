[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blockchain-dapp-testing-toolkit"
version = "0.1.0"
description = "Read-only JSON-RPC and dApp state verification examples"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
dapp-check = "dapp_testing.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

